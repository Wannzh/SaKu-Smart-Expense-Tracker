version: '3.8'

services:
  # Database Service (PostgreSQL) - Hanya terpakai jika dideploy di VPS/GCP lokal, tidak terpakai di Render karena pakai Supabase
  postgres:
    image: postgres:15-alpine
    container_name: saku_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sakupassword}
      POSTGRES_DB: ${DB_NAME:-sakudb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Node/Express API + Prisma)
  backend:
    build:
      context: ./backend      # KUNCI FLEKSIBEL: Docker Compose masuk ke folder backend dahulu
      dockerfile: Dockerfile  # Mengeksekusi Dockerfile baru yang ada di dalam folder backend
    container_name: saku_backend
    restart: unless-stopped
    # depends_on diganti menjadi opsional jika kamu pakai Supabase di cloud
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL} # Otomatis membaca dari file .env di luar
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    ports:
      - "5000:5000"

  # Frontend Service (Nginx serving React Vite build)
  frontend:
    build:
      context: ./frontend     # KUNCI FLEKSIBEL: Docker Compose masuk ke folder frontend dahulu
      dockerfile: Dockerfile  # Mengeksekusi Dockerfile baru yang ada di dalam folder frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: saku_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local